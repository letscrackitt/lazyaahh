<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop & Relax | The Lazy Corner</title><meta name="description" content="A silly little stress-free popping game. Click the floating things and enjoy their sounds."><link rel="canonical" href="https://letscrackitt.github.io/lazyaahh/pop-relax.html"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f6f0ff,#fff6e9 55%,#eaf8f6);color:#40364f;font-family:Nunito,system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:22px;display:flex;justify-content:space-between;gap:12px}header a{color:inherit;text-decoration:none;font-weight:800}main{max-width:1100px;margin:auto;padding:10px 22px 35px;text-align:center}h1{font:800 clamp(2rem,5vw,3.2rem)/1.1 'Baloo 2',sans-serif;margin:8px 0 0}.sub{margin:6px 0 15px;color:#746982}.tools{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 15px}.count{background:#fff;border:1px solid #e7dff0;border-radius:999px;padding:8px 17px;font-weight:800}.tools button{border:0;border-radius:999px;background:#594b70;color:white;padding:10px 18px;font:800 .95rem Nunito;cursor:pointer}.playfield{position:relative;min-height:570px;border:2px solid rgba(177,158,198,.55);border-radius:28px;background:rgba(255,255,255,.58);box-shadow:inset 0 0 35px #fff,0 12px 35px #63517a13;overflow:hidden}.thing{position:absolute;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 5px 5px #4b3c5b20);transition:transform .12s;animation:floaty 3.5s ease-in-out infinite alternate;user-select:none}.thing:hover{transform:scale(1.13) rotate(-7deg)}.thing span{display:block;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1}.thing.burst{pointer-events:none;animation:burst .28s ease-out forwards}.spark{position:absolute;pointer-events:none;font-size:1.25rem;animation:spark .55s ease-out forwards}@keyframes floaty{from{translate:0 -4px}to{translate:0 5px}}@keyframes burst{0%{scale:1;opacity:1}55%{scale:1.55;opacity:.8}100%{scale:.1;opacity:0}}@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(100deg) scale(.2);opacity:0}}.hint{font-size:.88rem;color:#81758e;margin:12px 0}@media(max-width:600px){.playfield{min-height:610px}.thing span{font-size:2.5rem}}</style></head><body><header><a href="index.html">← The Lazy Corner</a><a href="word-hunt.html">Play Word Hunt →</a></header><main><h1>Pop & Relax 💥</h1><p class="sub">A screen full of little things. Tap or click anything to burst it.</p><div class="tools"><span class="count">Popped: <b id="score">0</b></span><button id="soundBtn" type="button">Sound: on</button><button id="resetBtn" type="button">Fresh screen</button></div><div class="playfield" id="field" aria-label="Click or tap the floating objects to pop them"></div><p class="hint">Every little thing has its own popping sound. No timer, no goals. Just pop.</p></main><script>
(function(){const field=document.getElementById('field'),scoreEl=document.getElementById('score'),soundBtn=document.getElementById('soundBtn');const things=[['🫧','bubble'],['🎈','balloon'],['🍓','fruit'],['🍋','fruit'],['🍒','fruit'],['⭐','star'],['💜','heart'],['🧸','toy'],['🪇','toy'],['🧁','treat'],['🍭','treat'],['🪷','flower'],['🐥','animal'],['🐸','animal'],['🪩','sparkle'],['💎','sparkle'],['☁️','cloud'],['🧿','sparkle'],['🍄','nature'],['🌼','flower'],['🐱','animal'],['🦆','animal'],['🐷','animal'],['🐮','animal'],['🦖','animal'],['👻','ghost'],['🤡','face'],['💩','face'],['🤪','face'],['🥴','face'],['🍉','fruit'],['🥒','food'],['🌮','food'],['🍕','food'],['🧦','toy'],['🪿','animal'],['🛸','space'],['🚀','space'],['💣','cartoon'],['🪅','party'],['🧼','squish'],['🧽','squish'],['🐙','animal'],['🦄','animal'],['🥁','toy'],['🔔','toy']];let score=0,audio=null,sound=true;function audioReady(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume();return audio}const voiceLines=['Wheee!','Boing boing!','Oh, hello!','Plooop!','Ta-da!','Meep meep!','Well, that was silly.','Nom nom nom!','Whoopsie!','Ha ha ha!','Squeak!','Kaboom-ish!','I regret nothing!','Peekaboo!','Bloop!','Yee-haw!','Quack quack!','Ooh, shiny!','Pardon me!','A tiny explosion!','Mlem!','Surprise!','Toodle-oo!','Bonk!','Hehehe!','I have been popped!','Wobble wobble!','What was that?!','Mwahaha!','Pfft!'];let lastLine='';function voicePop(){if(!sound||!('speechSynthesis'in window)||Math.random()>.48)return;const lines=voiceLines.filter(x=>x!==lastLine),line=lines[Math.floor(Math.random()*lines.length)];lastLine=line;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line);const voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(voices.length)u.voice=voices[Math.floor(Math.random()*voices.length)];u.lang='en-IN';u.pitch=.65+Math.random()*1.35;u.rate=.78+Math.random()*.62;u.volume=.9;speechSynthesis.speak(u)}catch(e){}}function popSound(type){if(!sound)return;try{const a=audioReady();if(!a)return;const now=a.currentTime;const master=a.createGain();master.gain.value=.42;master.connect(a.destination);function tone(freq,dur,vol,wave='sine',slide=1){const o=a.createOscillator(),g=a.createGain();o.type=wave;o.frequency.setValueAtTime(freq,now);if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*slide),now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(master);o.start(now);o.stop(now+dur+.02)}const pick=(a)=>a[Math.floor(Math.random()*a.length)];switch(type){case'bubble':tone(pick([620,740,880]),.22,.24,'sine',.42);tone(1180,.16,.1,'sine',.7);break;case'balloon':tone(pick([180,220,260]),.32,.22,'triangle',2.4);break;case'fruit':case'food':case'treat':tone(pick([380,460,520]),.09,.22,'triangle',.55);tone(pick([760,880,990]),.12,.12);break;case'animal':tone(pick([240,330,440]),.16,.18,'sawtooth',pick([.55,1.8,2.3]));break;case'face':case'ghost':tone(pick([280,360,520]),.3,.2,'triangle',pick([.45,1.9,2.8]));break;case'squish':tone(pick([90,130,170]),.24,.28,'sine',pick([.55,1.7]));break;case'space':tone(880,.35,.17,'sine',.22);break;case'cartoon':tone(130,.22,.25,'square',2.8);break;case'party':case'toy':tone(pick([520,660,780]),.14,.2,'triangle');tone(pick([900,1100,1300]),.18,.12);break;case'heart':tone(392,.32,.16);tone(494,.38,.12);break;default:tone(pick([440,550,660,880]),.2,.18,'sine',pick([.7,1.4]))} }catch(e){}}function sparks(x,y){['✦','·','✧','✺'].forEach(v=>{let p=document.createElement('i');p.className='spark';p.textContent=v;p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--x',(Math.random()*100-50)+'px');p.style.setProperty('--y',(Math.random()*-90-15)+'px');field.appendChild(p);setTimeout(()=>p.remove(),600)})}function addThing(){let [emoji,type]=things[Math.floor(Math.random()*things.length)],b=document.createElement('button');b.className='thing';b.type='button';b.innerHTML='<span>'+emoji+'</span>';b.setAttribute('aria-label','Pop '+emoji);let w=field.clientWidth,h=field.clientHeight;b.style.left=(Math.random()*Math.max(0,w-72)+8)+'px';b.style.top=(Math.random()*Math.max(0,h-75)+8)+'px';b.style.animationDelay=(-Math.random()*4)+'s';b.style.rotate=(Math.random()*24-12)+'deg';b.addEventListener('click',()=>{audioReady();let r=b.getBoundingClientRect(),f=field.getBoundingClientRect();sparks(r.left-f.left+r.width/2,r.top-f.top+r.height/2);b.classList.add('burst');popSound(type);voicePop();score++;scoreEl.textContent=score;setTimeout(()=>{b.remove();addThing()},260)});field.appendChild(b)}function fill(){field.innerHTML='';for(let i=0;i<24;i++)addThing()}soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent='Sound: '+(sound?'on':'off');if(sound)audioReady()});document.getElementById('resetBtn').addEventListener('click',()=>{score=0;scoreEl.textContent='0';fill()});fill()})();
</script></body></html>
